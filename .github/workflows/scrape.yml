name: Daily Job Scrape

on:
  schedule:
    - cron: "0 6 * * 1-5" # 6am UTC, weekdays only
  workflow_dispatch: # allows manual trigger from GitHub UI

# ── Required for git push back to the repo ───────────────────────────────────
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use the built-in token — permissions block above grants write access
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          HOME_POSTCODE: ${{ secrets.HOME_POSTCODE }}
        run: node scraper.js

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the commute cache and any new output CSVs + index
          git add cache/commute-cache.json output/index.json output/jobs-*.csv

          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "scrape: $(date -u +%Y-%m-%d) — auto update"
            git push
          fi
