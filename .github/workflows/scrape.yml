name: Daily Job Scrape

on:
  # Scheduled runs are disabled — daily scraping now runs locally at logon via
  # scripts/daily-scrape.ps1 (which also opens the tracker). Re-add a `schedule:`
  # block here if you ever want the cloud/self-hosted cron back.
  workflow_dispatch: # manual trigger only, from the GitHub UI

# ── Required for git push back to the repo ───────────────────────────────────
permissions:
  contents: write

jobs:
  scrape:
    # Self-hosted runner on a residential (home) IP. The browser-scraped boards
    # (Indeed, CV-Library, Glassdoor) are blocked by anti-bot when run from
    # GitHub's cloud/datacenter IPs — only a residential IP gets through. The
    # API-based boards (Reed, Adzuna) work from anywhere.
    #
    # NOTE: scheduled runs only fire while the runner machine is online. If the
    # PC is off at the cron time, trigger manually via workflow_dispatch.
    runs-on: [self-hosted]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use the built-in token — permissions block above grants write access
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # Ensure bundled Chromium is present as a fallback. The scraper prefers
        # system-installed Google Chrome (channel: 'chrome'), which the anti-bot
        # lets through; make sure Chrome is installed on the runner machine.
        run: npx playwright install chromium

      - name: Run scraper
        shell: bash
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          HOME_POSTCODE: ${{ secrets.HOME_POSTCODE }}
        run: node scraper.js

      - name: Commit updated files
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the commute cache and any new output CSVs + index
          git add cache/commute-cache.json output/index.json output/jobs-*.csv

          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "scrape: $(date -u +%Y-%m-%d) — auto update"
            git pull --rebase
            git push
          fi
